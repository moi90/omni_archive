[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "omni_archive"
dynamic = ["version"]
authors = [
    { name = "Simon-Martin Schroeder", email = "sms@informatik.uni-kiel.de" }
]
description = "A generic archive reader and writer for various archive formats."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # pathlib_abc 0.3.1 is the last version that provides the PathBase/PurePathBase interface
    "pathlib_abc<=0.3.1",
    "fnmatch2"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]
docs = [
    "sphinx >= 1.4",
    "sphinx_rtd_theme",
    "sphinx-autodoc-typehints>=1.10.0"
]
dev = [
    "ruff",
]

[tool.coverage.report]
omit = [
    "omni_archive/_version.py",
]

[tool.pytest.ini_options]
addopts = "--cov=omni_archive --cov-report xml"

[tool.ruff]
line-length = 100
extend-exclude = ["omni_archive/_version.py"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "omni_archive/_version.py"